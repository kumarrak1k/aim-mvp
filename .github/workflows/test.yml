name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  # The smoke suite tests the LIVE site, so it must run after a deploy rather
  # than racing it. On push it fired immediately and hit the previous build,
  # so any commit that changed production behaviour failed CI once and then
  # "fixed itself" on the next unrelated push — noise that teaches you to
  # ignore the alert. Vercel posts a deployment_status when the deploy is
  # actually live; the e2e-smoke job below keys off that.
  deployment_status:

jobs:
  # ── Unit tests (Vitest) ──────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    if: github.event_name != 'deployment_status'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # ── Type checking ────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    if: github.event_name != 'deployment_status'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # ── Playwright E2E smoke tests ────────────────────────────────────────────────
  e2e-smoke:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    # Only after a PRODUCTION deploy reports success. Running on push tested
    # the build the commit was replacing, not the one it created.
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment, 'roduction')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright smoke tests
        run: npm run test:e2e -- --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'https://aicareermentor.co.uk' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
